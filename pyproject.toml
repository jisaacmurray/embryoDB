[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "embryodb"
version = "0.1.0"
description = "PostgreSQL-backed embryo metadata database for C. elegans lineage imaging"
readme = "README.md"
requires-python = ">=3.11"  # models.Status uses enum.StrEnum, which is 3.11+
license = { text = "MIT" }
authors = [{ name = "Murray Lab" }]
dependencies = [
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "typer>=0.12",
  "rich>=13.7",
  "qtpy>=2.4",
  # qtpy is only a shim — a real Qt binding must be importable too. Pull
  # PyQt5 automatically on Linux (the lab cluster, where PySide6 fails for
  # lack of libxcb-cursor0) so a bare `pip install -e .` is self-contained.
  # macOS gets no forced binding: install with `.[mac]` (PySide6) instead.
  # Override the active binding at runtime with the QT_API env var.
  "PyQt5>=5.15; sys_platform == 'linux'",
  "tifffile>=2024.1",   # image staging step; pulls numpy transitively
  "readlif>=0.6.6",     # Leica .lif reader (v2.10: lif-import); pure Python, mmap-backed
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]
# Explicit Qt-binding choices for when the platform default isn't right
# (forcing PySide6 on a Mac, PyQt6 anywhere, or re-asserting PyQt5).
mac = ["PySide6>=6.6"]
pyside6 = ["PySide6>=6.6"]
pyqt5 = ["PyQt5>=5.15"]
pyqt6 = ["PyQt6>=6.6"]

[project.scripts]
embryodb = "embryodb.cli:app"
embryodb-gui = "embryodb.gui.app:main"
embryodb-worker = "embryodb.pipeline.worker:main"
embryodb-open = "embryodb.cli:open_gui"

[tool.hatch.build.targets.wheel]
packages = ["embryodb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
