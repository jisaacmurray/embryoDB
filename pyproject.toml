[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "embryodb"
version = "0.1.0"
description = "PostgreSQL-backed embryo metadata database for C. elegans lineage imaging"
readme = "README.md"
requires-python = ">=3.11"  # models.Status uses enum.StrEnum, which is 3.11+
license = { text = "MIT" }
authors = [{ name = "Murray Lab" }]
dependencies = [
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "typer>=0.12",
  "rich>=13.7",
  "qtpy>=2.4",
  "tifffile>=2024.1",   # image staging step; pulls numpy transitively
  "readlif>=0.6.6",     # Leica .lif reader (v2.10: lif-import); pure Python, mmap-backed
  # One Qt binding must also be available: PyQt5, PyQt6, or PySide6.
  # qtpy auto-selects; QT_API env var overrides. On the lab cluster PyQt5
  # is pre-installed; on Macs `pip install pyside6` is the easiest path.
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.scripts]
embryodb = "embryodb.cli:app"
embryodb-gui = "embryodb.gui.app:main"
embryodb-worker = "embryodb.pipeline.worker:main"
embryodb-open = "embryodb.cli:open_gui"

[tool.hatch.build.targets.wheel]
packages = ["embryodb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
